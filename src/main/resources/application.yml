spring:
  datasource:
    url: jdbc:mysql://localhost:3306/itda?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update        # 개발 중엔 update, 운영 시 none으로 변경
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}           # .env에서 관리
            client-secret: ${GOOGLE_CLIENT_SECRET}   # .env에서 관리
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

jwt:
  secret: ${JWT_SECRET}      # .env에서 관리 (32자 이상 랜덤 문자열)
  expiration: 86400000       # 24시간 (ms)

server:
  port: 8080

# CORS 설정 - 프론트 주소
app:
  cors:
    allowed-origins: http://localhost:5173
  oauth2:
    redirect-uri: http://localhost:5173/oauth2/callback  # 로그인 성공 후 프론트로 리다이렉트
